name: Publish WSDM artifact to Hugging Face

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hugging-face-wsdm
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'dqswordman/rag-decision-sufficiency' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install the Hub client
        run: python -m pip install "huggingface_hub==1.26.0"
      - name: Stage, publish and verify the public mirror
        env:
          HF_OIDC_RESOURCE: spaces/DQSWORDMAN/rag-decision-sufficiency
        run: python scripts/publish_space.py "$RUNNER_TEMP/wsdm-space" --publish
