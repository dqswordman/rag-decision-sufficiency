  geometry_gate_fails: M8_GEOMETRY_DOES_NOT_REPLICATE; retain valid earlier-scope evidence without rescue
  adaptive_gate_fails: ADAPTIVE_METHOD_REFUTED; retain diagnostic risk result only
  fatal_generated_mismatch: TARGET_ESTIMAND_MISMATCH; prohibit DCC confirmation claim
  law_passes_method_fails: retain scale law without adaptive method
  method_passes_law_fails: report bounded adaptive result without universal DCC law
