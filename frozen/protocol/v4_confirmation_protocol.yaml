methods:
  exact_target_optimum:
    feasible_set: subsets with cardinality at most b
    tie_break: larger utility then smaller integer bitmask
    target_probes: 256
  P0_historical_fixed_source:
    target_probes: 0
    mapping: {qwen: mistral, gemma: mistral, mistral: gemma, phi: mistral}
    selected_set: exact at-most-b optimum of the mapped source model's target-aligned cube
  source_ensemble_secondary:
    target_probes: 0
    rule: mean of the other three source utility vectors after division by each frozen source scale
  retrospective_source_bounds_secondary:
    label: optimistic post-outcome descriptive bounds; never a fair prospective baseline
  P1_mplus1:
    target_probes: 9
    masks: empty set and all eight singleton masks
    reconstruction: exact degree-1 Mobius additive model; all higher-order coefficients zero
  P5_generic_hierarchical_omp_n9:
    target_probes: 9
    masks: >-
      empty and all eight singletons; if a count above m+1 is requested elsewhere,
      add remaining masks in SHA256(dataset|query|track|model|method_identity|mask|P5) order
    reconstruction: frozen deterministic hierarchical Walsh OMP
    max_terms: min(max(m+1, floor(n/4)), 24, n-1)
    initial_terms: constant then singleton Walsh terms
    hierarchy: an interaction term is eligible only after all immediate parents are selected
    tie_break: score then negative integer mask then integer mask
  P2_all_pairs:
    target_probes: 37
    masks: empty, eight singletons, and all 28 pairs
    reconstruction: exact degree-2 Mobius model; all degree-3-plus coefficients zero
  B_contender_k4_q50:
    base_target_probes: 9
    risk_score: negative raw no-context mean log probability
    trigger: risk_score >= 7.288293838500977
    primary_budget_for_contenders: 3
    contender_count: 4
    contender_rule: rank all at-most-3 masks by descending P1 additive prediction then ascending integer mask
    additional_pair_masks: every unique pair contained in at least one of the top four contender masks, ascending pair order
    reconstruction: exact degree-2 Mobius model using observed pairs; unobserved pair and all higher-order coefficients zero
    maximum_total_probes: 21
  random_same_cost_control:
    pair_order: SHA256(dataset|query|track|model|pair|RANDOM), then pair
    pair_count: identical to B_contender_k4_q50 for that cube
    reconstruction: same quadratic rule as the adaptive method
  generic_same_cost_control:
    target_probe_count: identical to B_contender_k4_q50 for that cube
    identity_suffix: B_contender_k4_q50|samecost
    reconstruction: same frozen deterministic hierarchical Walsh OMP as P5
statistics:
  primary_sampling_unit: query cluster
  cell: dataset x track x target model
  cell_count: 24
  aggregate_weighting: equal query-model-track rows; every cell has 60 queries
  bootstrap_resamples: 10000
  bootstrap_seed: 20271103
  confidence_interval: percentile 95 percent
  paired_contrasts: reuse the identical query-model-track row within every comparison
  report_all_cells: true
  primary_metrics:
    - target_normalized_regret
    - material_epsilon_optimal_rate
    - exact_optimum_match
    - generated token F1
    - generated exact match
geometry:
  quantities:
    - material negative marginal rate
    - query-bootstrap 95 percent CI
    - material positive-Hessian rate
    - query-bootstrap 95 percent CI
    - normalized negative-marginal mass
    - normalized positive-Hessian mass
  material_cell_rule: >-
    A cell passes if either its material-negative-marginal rate estimate is at
    least 0.05 and its query-bootstrap lower 95 percent bound exceeds 0.01, or
    its material-positive-Hessian rate estimate is at least 0.05 and its
    query-bootstrap lower 95 percent bound exceeds 0.01.
  replication_gate: at least 18 of 24 cells, representing all three datasets, both tracks, and all four target families
success_gates:
  DCC_1_4:
    cell_pass: mean P1 b3 target-normalized regret is strictly lower than both P0 and P5-n9
    breadth: at least 18 of 24 cells pass, representing all three datasets, both tracks, and all four target families
    geometry: geometry replication gate passes independently
    regret_capture: aggregate (P0-P1)/(P0-P2) is at least 0.50 when denominator is positive
    generated_validation: fatal estimand mismatch rule does not trigger
  adaptive_B:
    aggregate: adaptive b3 mean normalized regret is strictly below P1 and both exact same-cost controls
    breadth: at least 18 of 24 cells have adaptive regret strictly below both same-cost controls
    cost: average target probes at most 13 and 90th-percentile target probes at most 21
  exact_set_recovery: reported but not a success requirement
  b4: secondary robustness only; cannot rescue a failed b3 gate
generated_answer_validation:
  scope: deduplicated selected sets only; never the 256-set cube
  selection_roles: [exact_target_optimum, P0_historical_fixed_source, P1_mplus1, P5_generic_hierarchical_omp_n9, P2_all_pairs, B_contender_k4_q50]
  decoder: greedy; do_sample false; temperature omitted; one sequence; maximum 64 new tokens; deterministic model defaults otherwise
  normalization: frozen SQuAD-style lowercase-punctuation-article-whitespace answer normalization
  metrics: [token_f1, exact_match]
  inference: paired query-cluster bootstrap with 10000 resamples; all 24 cells and negative cells reported
  primary_contrasts: [P1_minus_P0, P1_minus_P5, adaptive_minus_P1]
  fatal_mismatch_rule: >-
    Fatal only if both aggregate P1-minus-P0 and P1-minus-P5 token-F1 upper
    95 percent confidence bounds are below zero and the raw token-F1 direction
    is negative in at least 18 of 24 dataset-track-model cells. EM is reported
    as corroboration and cannot alone trigger or rescue this rule.
